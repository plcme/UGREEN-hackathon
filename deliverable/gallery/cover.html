<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400&family=Inter+Tight:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEE8DB;--ink:#16302A;--ink2:#5E6B64;--red:#D2462B}
*{margin:0;box-sizing:border-box}
body{width:1500px;height:1000px;background:var(--paper);position:relative;overflow:hidden;color:var(--ink)}
.grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:300;letter-spacing:.08em;text-transform:uppercase}
.reg{position:absolute;width:22px;height:22px}
.reg:before,.reg:after{content:"";position:absolute;background:var(--ink)}
.reg:before{left:10px;top:0;width:1px;height:22px}.reg:after{top:10px;left:0;height:1px;width:22px}
#grid{position:absolute;left:96px;top:190px}
.hdr{position:absolute;left:96px;top:120px;font-size:12px;color:var(--ink2)}
.hdr2{position:absolute;left:96px;top:142px;width:672px;border-top:1px solid var(--ink)}
.title{position:absolute;left:880px;top:250px;font-family:'Instrument Serif',serif;font-size:168px;line-height:.86;letter-spacing:-2px}
.title i{color:var(--red)}
.tag{position:absolute;left:886px;top:624px;width:470px;font-family:'Inter Tight',sans-serif;font-weight:300;font-size:27px;line-height:1.35;color:var(--ink)}
.rule{position:absolute;left:886px;top:600px;width:56px;border-top:1px solid var(--red)}
.kicker{position:absolute;left:886px;top:205px;font-size:12px;color:var(--ink2)}
.legend{position:absolute;left:96px;top:842px;display:flex;gap:34px;font-size:12px;color:var(--ink2);align-items:center}
.legend span{display:flex;align-items:center;gap:10px}
.sw{width:14px;height:18px;display:inline-block}
.fig{position:absolute;left:886px;top:842px;font-family:'Instrument Serif',serif;font-style:italic;font-size:19px;color:var(--ink2)}
.foot{position:absolute;left:96px;bottom:70px;right:96px;border-top:1px solid var(--ink);padding-top:12px;display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)}
</style></head><body>
<svg class="grain" width="1500" height="1000"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .5 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="reg" style="left:40px;top:40px"></div><div class="reg" style="right:40px;top:40px"></div>
<div class="reg" style="left:40px;bottom:40px"></div><div class="reg" style="right:40px;bottom:40px"></div>
<div class="hdr mono">Household archive &nbsp;·&nbsp; 48 records &nbsp;·&nbsp; inspected for absence</div>
<div class="hdr2"></div>
<svg id="grid" width="680" height="620"></svg>
<div class="kicker mono">A UGREEN AI NAS Skill</div>
<div class="title">Paper<br><i>Nag</i></div>
<div class="rule"></div>
<div class="tag">The family paperwork assistant that nags you before an emergency does.</div>
<div class="legend mono">
 <span><i class="sw" style="background:var(--ink)"></i>Filed</span>
 <span><i class="sw" style="border:1.2px dashed var(--red)"></i>Missing</span>
 <span><i class="sw" style="background:linear-gradient(to top,var(--ink) 50%,transparent 50%);border:1px solid var(--ink)"></i>Expiring</span>
 <span><i style="width:26px;border-top:1px solid var(--red);display:inline-block"></i>Implies</span>
</div>
<div class="fig">Fig. 1 — One document implies another.</div>
<div class="foot mono"><span>Reasons across documents</span><span>Asks what is missing</span><span>Nothing leaves home</span></div>
<script>
const g=document.getElementById('grid'),NS='http://www.w3.org/2000/svg';
const C=8,R=6,W=68,H=86,GX=16,GY=16;
const missing={'1,3':1,'2,6':1,'4,1':1,'5,5':1};
const expiring={'0,5':1,'3,2':1,'4,7':1};
const links=[['0,3','1,3'],['2,4','2,6'],['3,1','4,1'],['5,3','5,5']];
const labels={'1,3':'INV','2,6':'WAR','4,1':'PHO','5,5':'RCP'};
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);g.appendChild(e);return e}
function pos(k){const[r,c]=k.split(',').map(Number);return[c*(W+GX),r*(H+GY)]}
function card(x,y,cls){
 const d=`M${x} ${y+8} h22 l6 -8 h${W-28} v${H} h-${W} z`;
 if(cls==='m'){el('path',{d,fill:'none',stroke:'#D2462B','stroke-width':1.2,'stroke-dasharray':'4 3'});}
 else if(cls==='e'){el('path',{d,fill:'none',stroke:'#16302A','stroke-width':1});el('rect',{x,y:y+8+(H-8)/2,width:W,height:(H-8)/2+8-8,fill:'#16302A'});}
 else el('path',{d,fill:'#16302A'});
}
let n=1;
for(let r=0;r<R;r++)for(let c=0;c<C;c++){
 const k=r+','+c,[x,y]=pos(k);
 card(x,y,missing[k]?'m':expiring[k]?'e':'f');
 const t=el('text',{x:x+6,y:y+H-6,'font-family':'IBM Plex Mono','font-size':8,'letter-spacing':'.5',fill:missing[k]?'#D2462B':expiring[k]?'#EEE8DB':'#9FB0A8'});
 t.textContent=String(n++).padStart(2,'0');
 if(missing[k]){const l=el('text',{x:x+W/2,y:y+H/2+8,'text-anchor':'middle','font-family':'IBM Plex Mono','font-size':10,'letter-spacing':'1',fill:'#D2462B'});l.textContent=labels[k];}
}
for(const[a,b] of links){const[x1,y1]=pos(a),[x2,y2]=pos(b);
 const ax=x1+W/2,ay=y1+H+0,bx=x2+W/2,by=y2+H;
 const sx=ax,sy=y1+H/2+4,ex=bx,ey=y2+H/2+4;
 const midY=Math.min(sy,ey)-(H/2+GY/2+4);
 // route through the gutter above the row
 const gy=(a.split(',')[0]===b.split(',')[0])? y1-GY/2 : (y1+H+GY/2);
 el('path',{d:`M${sx} ${a.split(',')[0]===b.split(',')[0]?y1+8:y1+H} V${gy} H${ex} V${a.split(',')[0]===b.split(',')[0]?y2+8:y2}`,fill:'none',stroke:'#D2462B','stroke-width':1});
 el('circle',{cx:sx,cy:gy,r:2.2,fill:'#D2462B'});
}
</script></body></html>
